name: "tofu Apply"

on:
  push:
    branches:
      - main

jobs:
  tofu-apply:
    name: "tofu Apply"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TF_VERSION: "v1.11.6"
    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::261175718795:role/github-actions-infra
          aws-region: eu-central-1
          audience: sts.amazonaws.com

      - name: "Setup tofu"
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: ${{ env.TF_VERSION }}

      - name: Configure Git for private modules
        run: git config --global url."https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/".insteadOf "https://github.com/"

      - name: "tofu Init"
        id: init
        run: tofu init

      - name: "tofu Plan"
        id: plan
        run: tofu plan -no-color -out=tfplan

      - name: "tofu Apply"
        id: apply
        run: tofu apply -auto-approve tfplan

      - name: "tofu Output"
        run: tofu output -json > tofu_outputs.json

      - name: "Upload Generated Files"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tofu-artifacts
          path: |
            tfplan
            tofu_outputs.json
          retention-days: 30
